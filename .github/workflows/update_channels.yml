name: Update auto channels

on:
  schedule:
    - cron: '0 */6 * * *'   # كل 6 ساعات
  workflow_dispatch:         # تشغيل يدوي عند الحاجة

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch channels
        run: python3 scripts/update_channels.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets/auto_channels.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/auto_channels.json
            git commit -m "chore: update auto channels"
            git push
          else
            echo "No changes."
          fi
