name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android folder if missing
        run: flutter create --platforms=android --org com.alfaham --project-name alfaham_sat .

      - name: Patch AndroidManifest (internet, http, app name) and package name
        run: |
          python3 - <<'PY'
          import re, glob
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Alfaham Sat"', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)

          # Package name (applicationId) = app.alfaham.sat
          for g in glob.glob('android/app/build.gradle*'):
              t = open(g, encoding='utf-8').read()
              t = re.sub(r'applicationId\s*=?\s*["\'][^"\']*["\']', 'applicationId = "app.alfaham.sat"', t)
              open(g, 'w', encoding='utf-8').write(t)
          PY

      - run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build one universal APK (all devices)
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/alfaham-sat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: alfaham-sat-apk
          path: build/app/outputs/flutter-apk/alfaham-sat.apk
